[package]
default-run = "le-souvenir-v2"
name = "le-souvenir-v2"
version = "0.1.0"
edition = "2021"

[lib]
name = "le_souvenir_v2"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[[bin]]
name = "le-souvenir-v2"
path = "src/main.rs"
test = false

[[bin]]
name = "bridge-probe"
path = "src/probe.rs"
test = false
